name: Build RK Studio APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable preview signing
        if: github.event_name != 'pull_request'
        env:
          PREVIEW_KEYSTORE: ${{ secrets.RKSTUDIO_PREVIEW_KEYSTORE }}
        run: |
          test -n "$PREVIEW_KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --max-workers=2 --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RK-Studio-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RK-Studio-debug
          path: RK-Studio-debug.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: RK-Studio-debug.apk
