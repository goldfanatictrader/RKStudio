name: RKStudio UI verification
on:
  push:
    branches: [main]
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/**'
      - 'app/src/debug/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - '.github/workflows/ui-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Create media fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p app/src/main/assets
          ffmpeg -f lavfi -i color=c=0x394232:s=360x640:r=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/main/assets/reference.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify at 360dp and 130 percent font scale
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            gradle connectedDebugAndroidTest --max-workers=2 --stacktrace; result=$?; mkdir -p qa-screens; adb exec-out run-as com.rkstudio.cliplocal.ai.preview.md tar -C files -cf - qa > qa-screens.tar; tar -xf qa-screens.tar -C qa-screens; exit $result
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p qa-screens
          test -f qa-screens.tar && tar -xf qa-screens.tar -C qa-screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RKStudio-UI-QA
          path: |
            qa-screens
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
